# Baut die Browser-Version (WebAssembly, mit clang) und veröffentlicht sie über
# einen Cloudflare Worker: Anmeldung mit Discord, nur freigegebene Accounts dürfen
# spielen. Einrichtung: README, Abschnitt "Anmeldung mit Discord".
name: Webseite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: clang und wasm-ld
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Datencheck
        run: python3 tools/check_art.py src/game_data.inc
      - name: Server-Test (Login und Whitelist)
        run: node server/test.mjs
      - name: WebAssembly bauen und Seite zusammenstellen
        run: |
          mkdir -p server/public/downloads
          clang --target=wasm32 -O2 -ffreestanding -nostdlib -Wall -Wno-pointer-sign \
            -Wl,--no-entry -Wl,-z,stack-size=262144 -Wl,--strip-all \
            -o server/public/stanna.wasm src/game.c src/plat_web.c
          cp web/index.html web/stanna.js web/icon.png server/public/
          cp bin/StAnna.exe bin/StAnna.apk bin/StAnna.nro server/public/downloads/
          git archive --format=zip --prefix=StAnnaSchule/ -o server/public/downloads/StAnnaSchule-Quelltext.zip HEAD
          ls -l server/public
      - name: Cloudflare eingerichtet?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Die Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen (siehe README)."
            exit 1
          fi
      - name: Speicher für die Whitelist (KV) suchen oder anlegen
        working-directory: server
        run: |
          find_id() { npx --yes wrangler@4 kv namespace list | jq -r '[.[] | select(.title | endswith("stanna-users"))][0].id // empty'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx --yes wrangler@4 kv namespace create stanna-users
            id=$(find_id)
          fi
          test -n "$id"
          sed -i "s/KV_ID_PLACEHOLDER/$id/" wrangler.toml
      - name: Veröffentlichen
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: "4"
          command: deploy
          secrets: |
            DISCORD_CLIENT_ID
            DISCORD_CLIENT_SECRET
            SESSION_SECRET
            ADMIN_DISCORD_ID
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_DISCORD_ID: ${{ secrets.ADMIN_DISCORD_ID }}
